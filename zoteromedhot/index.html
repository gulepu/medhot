<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#13191c">
<title>ZoteroMedHOT — 我的文献库热点日报 · 订阅新品 × 库内热榜</title>
<meta name="description" content="ZoteroMedHOT：从本地 Zotero 文献库自动生成的每日热点——订阅（CNKI/PubMed/期刊目录）新入库文献 + 按引用与施用关系排序的库内热榜。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <span class="logo">Zotero<span class="logo-accent">MedHOT</span></span>
      <span class="sub">我的文献库热点日报</span>
    </div>
    <div class="top-actions">
      <span class="date-badge" id="todayBadge"></span>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>今日文献热点</h1>
    <p class="hero-desc">数据源：<strong>本地 Zotero 文献库</strong>（~/Zotero）— 上半区为 <strong>订阅新品</strong>（CNKI 期刊 / PubMed 疾病搜索 / 期刊目录 等近 24h 入库），下半区为 <strong>库内热榜</strong>：按引用及施用关系（库内手联 · 笔记 · AI 解读 · 收藏 · 标签）给主库文献排热度。徽章展示每条文献的热度构成。</p>
    <div class="cat-tabs" id="catTabs"></div>
  </section>

  <section class="feed" id="feed"></section>

  <footer class="foot">
    <p>ZoteroMedHOT · 纯脚本构建（build.py 读取 zotero.sqlite），每日更新 | 链接均指向原文</p>
    <p class="foot-src" id="footSrc"></p>
  </footer>
</main>

<script src="app.js"></script>
</body>
</html>
